name: Build NONOXP 3DS
on:
  push:
    branches: [nonoxp-3ds]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Make sure the 3DS libraries are present
        run: |
          for i in 1 2 3; do dkp-pacman -Sy --noconfirm --needed 3ds-dev 3ds-libvorbisidec 3ds-libogg && break; sleep 20; done
          ls $DEVKITPRO/portlibs/3ds/lib | grep -E "vorbisidec|ogg" || (echo "Tremor/Ogg libraries missing" && exit 1)
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: nonoxp-3dsx
          path: |
            nonoxp.3dsx
            nonoxp.smdh
            nonoxp.elf
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch libraries
        run: for i in 1 2 3; do dkp-pacman -Sy --noconfirm --needed switch-dev switch-sdl2 switch-libvorbis switch-libogg && break; sleep 20; done
      - name: Build
        run: |
          make -f Makefile.switch
          elf2nso nonoxp.elf main
          npdmtool tools/nsp_maker/exefs.json main.npdm
          ls -l nonoxp.nro nonoxp.nacp main main.npdm
          cp nonoxp.nro NonomuraHospitalHD.nro
      - name: nx-hbloader (reference exefs for NSP launch tests)
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/switchbrew/nx-hbloader.git hbl
          make -C hbl
          ls -l hbl
          cat hbl/*.json || true
          mkdir -p hblout && cp hbl/*.nso hblout/hbl_main 2>/dev/null; cp hbl/*.npdm hblout/hbl.npdm 2>/dev/null; cp hbl/*.json hblout/ 2>/dev/null; ls -l hblout
      - name: NSP loader (nx-hbloader starting romfs:/nonoxp.nro)
        run: |
          set -e
          rm -rf fwd && git clone --depth 1 https://github.com/switchbrew/nx-hbloader.git fwd
          python3 tools/nsp_maker/mkfwd.py patch fwd/source/main.c
          make -C fwd
          cp fwd/hbl.nso fwd_main
          python3 tools/nsp_maker/mkfwd.py npdm fwd/hbl.npdm fwd.npdm 01004e4f4e4f0000
          ls -l fwd_main fwd.npdm
          rm -rf fwdr && git clone --depth 1 https://github.com/switchbrew/nx-hbloader.git fwdr
          python3 tools/nsp_maker/mkfwd.py romfs fwdr/source/main.c
          make -C fwdr
          cp fwdr/hbl.nso fwdr_main
          ls -l fwdr_main
      - uses: actions/upload-artifact@v4
        with:
          name: nonoxp-switch
          path: |
            nonoxp.nro
            NonomuraHospitalHD.nro
            nonoxp.nacp
            main
            main.npdm
            fwd_main
            fwd.npdm
            fwdr_main
            hblout
  # installable version (.cia): the same program wrapped with makerom, the icon and the moving 3D banner (ctr/banner.cgfx,
  # made for the DOS port on branch main). Game files stay on the SD card (sdmc:/3ds/nonoxp/).
  cia:
    needs: [build, switch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: nonoxp-3dsx, path: out }
      - uses: actions/download-artifact@v4
        with: { name: nonoxp-switch, path: out }
      - name: Get makerom
        run: |
          set -e
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git tools-ctr
          make -C tools-ctr/makerom -j"$(nproc)"
          cp "$(find tools-ctr/makerom -type f -name makerom | head -n 1)" ./makerom
      - name: Get bannertool
        run: |
          git config --global url."https://github.com/".insteadOf git://github.com/
          export GIT_TERMINAL_PROMPT=0
          for repo in Epicpkmn11/bannertool carstene1ns/3ds-bannertool; do
            rm -rf tools-bt
            git clone --depth 1 "https://github.com/$repo.git" tools-bt || continue
            if [ -f tools-bt/.gitmodules ] && ! git -C tools-bt submodule update --init --depth 1; then
              rm -rf tools-bt/buildtools
              git clone --depth 1 https://github.com/Epicpkmn11/buildtools.git tools-bt/buildtools || continue
            fi
            if make -C tools-bt -j"$(nproc)"; then
              bt="$(find tools-bt -type f -name bannertool -perm -u+x | head -n 1)"
              if [ -n "$bt" ]; then cp "$bt" ./bannertool && echo "using $repo" && break; fi
            fi
          done
          ls -l bannertool || echo "NO BANNERTOOL"
      - name: Make banner and CIA
        run: |
          set -e
          banner=""
          if [ -x ./bannertool ]; then
            ./bannertool makebanner -i ctr/banner.png -a ctr/banner.wav -o out/banner.bnr
            if ./bannertool makebanner -ci ctr/banner.cgfx -a ctr/banner.wav -o out/banner3d.bnr; then mv out/banner3d.bnr out/banner.bnr; else echo "::warning::3D banner failed - flat banner"; fi
            banner="-banner out/banner.bnr"
          fi
          # a new title version on every build: the HOME Menu keeps a title's banner cached until its version changes
          n=$GITHUB_RUN_NUMBER; ver="-major 1 -minor $(( (n / 16) % 64 )) -micro $(( n % 16 ))"
          ./makerom -f cia -o out/nonoxp.cia $ver -elf out/nonoxp.elf -rsf ctr/nonoxp.rsf -icon out/nonoxp.smdh $banner -exefslogo -target t
          cp out/nonoxp.3dsx out/NonomuraHospitalHD.3dsx; cp out/nonoxp.cia out/NonomuraHospitalHD.cia
          python3 tools/cia_maker_xp/build.py out/nonoxp.cia out/NonomuraHospitalHD_cia_maker.html "$(date -u +%Y-%m-%d) 판"
          python3 tools/nsp_launcher/build.py out/fwd_main out/fwd.npdm out/nonoxp.nacp assets/icon_switch.jpg out/NonomuraHospitalHD_nsp_launcher.html "$(date -u +%Y-%m-%d) 판"
          python3 tools/nsp_maker/build.py out/fwdr_main out/fwd.npdm out/nonoxp.nacp --nro out/NonomuraHospitalHD.nro assets/icon_switch.jpg out/NonomuraHospitalHD_nsp_maker.html "$(date -u +%Y-%m-%d) 판"
          ls -l out
      - name: Publish binaries as release "nonoxp-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nonoxp-latest
          name: NonoXP (3DS / Switch) latest build
          make_latest: false
          files: |
            out/NonomuraHospitalHD.3dsx
            out/NonomuraHospitalHD.cia
            out/NonomuraHospitalHD_cia_maker.html
            out/NonomuraHospitalHD.nro
            out/NonomuraHospitalHD_nsp_maker.html
            out/NonomuraHospitalHD_nsp_launcher.html
            out/hblout/*
            out/fwd_main
            out/fwdr_main
            out/fwd.npdm
            out/nonoxp.nacp
      - name: Publish binaries to branch nonoxp-3ds-bin
        run: |
          mkdir pub && cp out/NonomuraHospitalHD.3dsx out/nonoxp.smdh out/NonomuraHospitalHD.cia out/NonomuraHospitalHD_cia_maker.html out/NonomuraHospitalHD.nro out/NonomuraHospitalHD_nsp_maker.html out/NonomuraHospitalHD_nsp_launcher.html out/main out/main.npdm out/nonoxp.nacp pub/ && cd pub
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/nonoxp-3ds-bin || echo "branch push refused (push protection false positive) - the release has the files"
