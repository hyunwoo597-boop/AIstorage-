name: Build 3DS (nonomura.3dsx)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Make sure the 3DS libraries are present
        run: dkp-pacman -Sy --noconfirm --needed 3ds-dev || true
      - name: Build
        run: make -C ctr
      - uses: actions/upload-artifact@v4
        with:
          name: nonomura-3dsx
          path: |
            ctr/nonomura.3dsx
            ctr/nonomura.smdh
      - uses: actions/upload-artifact@v4
        with:
          name: nonomura-elf
          path: ctr/nonomura.elf
      - name: Publish as release "latest" (easy download from a phone)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: nonomura.3dsx (latest build)
          body: "Latest automatic build. nonomura.3dsx: copy to SD:/3ds/ (Homebrew Launcher). nonomura.cia: installable app (install with FBI etc.). Game files go to SD:/3ds/nonomura/"
          files: |
            ctr/nonomura.3dsx
            ctr/nonomura.smdh

  # The installable version (.cia): the same program, wrapped with makerom together with the icon and a banner.
  cia:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nonomura-elf
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: nonomura-3dsx
          path: out
      - name: Get makerom
        run: |
          set -e
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git tools-ctr
          make -C tools-ctr/makerom -j"$(nproc)"
          cp "$(find tools-ctr/makerom -type f -name makerom | head -n 1)" ./makerom
          ./makerom -help | head -n 3 || true
      - name: Get bannertool
        run: |
          # (the original Steveice10/bannertool repository is gone; try the maintained forks in turn)
          git config --global url."https://github.com/".insteadOf git://github.com/
          export GIT_TERMINAL_PROMPT=0
          for repo in Epicpkmn11/bannertool carstene1ns/3ds-bannertool; do
            echo "== $repo"
            rm -rf tools-bt
            git clone --depth 1 "https://github.com/$repo.git" tools-bt || continue
            if [ -f tools-bt/.gitmodules ] && ! git -C tools-bt submodule update --init --depth 1; then
              echo "-- submodule failed, trying the buildtools fork"
              rm -rf tools-bt/buildtools
              git clone --depth 1 https://github.com/Epicpkmn11/buildtools.git tools-bt/buildtools || continue
            fi
            ls tools-bt tools-bt/buildtools 2>/dev/null | head -n 40
            if make -C tools-bt -j"$(nproc)"; then
              bt="$(find tools-bt -type f -name bannertool -perm -u+x | head -n 1)"
              if [ -n "$bt" ]; then cp "$bt" ./bannertool && echo "using $repo" && break; fi
            fi
          done
          ls -l bannertool || echo "NO BANNERTOOL"
      - name: Make banner and CIA
        run: |
          set -e
          banner=""
          if [ -x ./bannertool ]; then
            ./bannertool makebanner -i ctr/banner.png -a ctr/banner.wav -o out/banner.bnr
            # 움직이는 입체 배너: tools/gen_banner_cgfx.py 가 미리 만들어 둔 ctr/banner.cgfx 를 묶는다 (실패하면 평면 그대로)
            if ./bannertool makebanner -ci ctr/banner.cgfx -a ctr/banner.wav -o out/banner3d.bnr; then
              mv out/banner3d.bnr out/banner.bnr
            else
              echo "::warning::3D banner step failed - keeping the flat banner"
            fi
            banner="-banner out/banner.bnr"
          else
            echo "::warning::bannertool not available - building the CIA without a banner"
          fi
          ./makerom -f cia -o out/nonomura.cia -elf out/nonomura.elf -rsf ctr/nonomura.rsf -icon out/nonomura.smdh $banner -exefslogo -target t
          python3 tools/cia_maker/build.py out/nonomura.cia out/nonomura_cia_maker.html "$(date -u +%Y-%m-%d) 판"
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: nonomura-cia
          path: out/nonomura.cia
      - name: Add the CIA to release "latest"
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: |
            out/nonomura.cia
            out/nonomura_cia_maker.html
      - name: Keep the CIA tools for building a CIA that carries the game files (done by hand, not in CI)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tools
          name: build tools (makerom, bannertool)
          body: "Linux x86_64 binaries of makerom and bannertool, plus the ELF and banner of the latest build, as made by CI (used to make the CIA that has the game files inside; those files are not in this repository)."
          make_latest: false
          files: |
            makerom
            bannertool
            out/nonomura.elf
            out/banner.bnr
