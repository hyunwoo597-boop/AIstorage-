name: Build NONOXP 3DS
on:
  push:
    branches: [nonoxp-3ds]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Make sure the 3DS libraries are present
        run: |
          for i in 1 2 3; do dkp-pacman -Sy --noconfirm --needed 3ds-dev 3ds-libvorbisidec 3ds-libogg && break; sleep 20; done
          ls $DEVKITPRO/portlibs/3ds/lib | grep -E "vorbisidec|ogg" || (echo "Tremor/Ogg libraries missing" && exit 1)
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: nonoxp-3dsx
          path: |
            nonoxp.3dsx
            nonoxp.smdh
            nonoxp.elf
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch libraries
        run: for i in 1 2 3; do dkp-pacman -Sy --noconfirm --needed switch-dev switch-sdl2 switch-libvorbis switch-libogg && break; sleep 20; done
      - name: Build
        run: make -f Makefile.switch
      - uses: actions/upload-artifact@v4
        with: { name: nonoxp-switch, path: nonoxp.nro }
  # installable version (.cia): the same program wrapped with makerom, the icon and the moving 3D banner (ctr/banner.cgfx,
  # made for the DOS port on branch main). Game files stay on the SD card (sdmc:/3ds/nonoxp/).
  cia:
    needs: [build, switch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: nonoxp-3dsx, path: out }
      - uses: actions/download-artifact@v4
        with: { name: nonoxp-switch, path: out }
      - name: Get makerom
        run: |
          set -e
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git tools-ctr
          make -C tools-ctr/makerom -j"$(nproc)"
          cp "$(find tools-ctr/makerom -type f -name makerom | head -n 1)" ./makerom
      - name: Get bannertool
        run: |
          git config --global url."https://github.com/".insteadOf git://github.com/
          export GIT_TERMINAL_PROMPT=0
          for repo in Epicpkmn11/bannertool carstene1ns/3ds-bannertool; do
            rm -rf tools-bt
            git clone --depth 1 "https://github.com/$repo.git" tools-bt || continue
            if [ -f tools-bt/.gitmodules ] && ! git -C tools-bt submodule update --init --depth 1; then
              rm -rf tools-bt/buildtools
              git clone --depth 1 https://github.com/Epicpkmn11/buildtools.git tools-bt/buildtools || continue
            fi
            if make -C tools-bt -j"$(nproc)"; then
              bt="$(find tools-bt -type f -name bannertool -perm -u+x | head -n 1)"
              if [ -n "$bt" ]; then cp "$bt" ./bannertool && echo "using $repo" && break; fi
            fi
          done
          ls -l bannertool || echo "NO BANNERTOOL"
      - name: Make banner and CIA
        run: |
          set -e
          banner=""
          if [ -x ./bannertool ]; then
            ./bannertool makebanner -i ctr/banner.png -a ctr/banner.wav -o out/banner.bnr
            if ./bannertool makebanner -ci ctr/banner.cgfx -a ctr/banner.wav -o out/banner3d.bnr; then mv out/banner3d.bnr out/banner.bnr; else echo "::warning::3D banner failed - flat banner"; fi
            banner="-banner out/banner.bnr"
          fi
          ./makerom -f cia -o out/nonoxp.cia -elf out/nonoxp.elf -rsf ctr/nonoxp.rsf -icon out/nonoxp.smdh $banner -exefslogo -target t
          python3 tools/cia_maker_xp/build.py out/nonoxp.cia out/nonoxp_cia_maker.html "$(date -u +%Y-%m-%d) 판"
          ls -l out
      - name: Publish binaries to branch nonoxp-3ds-bin
        run: |
          mkdir pub && cp out/nonoxp.3dsx out/nonoxp.smdh out/nonoxp.cia out/nonoxp_cia_maker.html out/nonoxp.nro pub/ && cd pub
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/nonoxp-3ds-bin
