name: Build NONOXP 3DS
on:
  push:
    branches: [nonoxp-3ds]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Make sure the 3DS libraries are present
        run: dkp-pacman -Sy --noconfirm --needed 3ds-dev 3ds-libvorbisidec 3ds-libogg
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: nonoxp-3dsx
          path: |
            nonoxp.3dsx
            nonoxp.smdh
      - name: Publish binary to branch nonoxp-3ds-bin
        run: |
          mkdir out && cp nonoxp.3dsx nonoxp.smdh out/ && cd out
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/nonoxp-3ds-bin
