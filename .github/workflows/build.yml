name: Build 3DS (nonomura.3dsx)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Make sure the 3DS libraries are present
        run: dkp-pacman -Sy --noconfirm --needed 3ds-dev || true
      - name: Build
        run: make -C ctr
      - uses: actions/upload-artifact@v4
        with:
          name: nonomura-3dsx
          path: |
            ctr/nonomura.3dsx
            ctr/nonomura.smdh
      - name: Publish as release "latest" (easy download from a phone)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: nonomura.3dsx (latest build)
          body: "Latest automatic build. Copy nonomura.3dsx to SD:/3ds/ and the game files to SD:/3ds/nonomura/"
          files: |
            ctr/nonomura.3dsx
            ctr/nonomura.smdh
